name: "One1"
description: "One App VIP / purchased / adblock for Egern native API"
author: "whylkk"
homepage: "https://github.com/whylkk/one-tk"
icon: "play.rectangle.fill"

url_rewrites:
  - match: ^https?://.*/v2\.5/ad/space
    location: "https://reject.local/"
    status_code: 404

scriptings:
  - http_response:
      name: "One1"
      match: ^https?://.*/v2\.5/
      script_url: "https://cdn.jsdelivr.net/gh/whylkk/one-tk@main/one1-egern.js"
      body_required: true
      timeout: 30
      max_size: 2097152
      update_interval: 0

mitm:
  hostnames:
    includes:
      - "api.*"
      - "*.einhn4.com"
      - "*.em1oifd0.com"
      - "*.xqjby.com"
      - "*.scycjz.com"
      - "38.46.10.*"
      - "202.95.22.*"
      - "198.44.248.*"
      - "122.10.20.249"
