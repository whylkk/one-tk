name: publish-one1-soft

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build software-style one1.js
        run: python3 scripts/publish_one1_soft.py

      - name: Show header
        run: head -30 one1.js

      - name: Commit one1.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add one1.js
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "feat: one1.js software-style (rewrite_local + mitm header)"
            git push
          fi
