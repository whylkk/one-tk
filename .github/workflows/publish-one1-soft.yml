name: publish-one1-soft

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build software-style one1.js + one1.conf
        run: python3 scripts/publish_one1_soft.py

      - name: Show header
        run: head -35 one1.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add one1.js one1.conf
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "fix: one1 keep.js-style header + one1.conf for resource parser"
            git push
          fi
